הנה קוד ה-YAML המלא והמדויק עבור ה-GitHub Action שמושך את ההקלטות מ-Fireflies ומעדכן את קובץ הנתונים.
ע태ק את הקוד הזה לתוך קובץ חדש בנתיב:
.github/workflows/fetch-fireflies.yml
name: Fetch Fireflies Transcripts

on:
  schedule:
    - cron: '0 6 * * *' # רץ כל יום ב-06:00 בבוקר
  workflow_dispatch: # מאפשר הפעלה ידנית מתי שתרצה

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch from Fireflies
        run: |
          mkdir -p ./data
          curl -X POST https://api.fireflies.ai/graphql \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.FIREFLIES_API_KEY }}" \
          --data '{"query": "{ transcripts(limit: 20) { id title date audio_url summary { overview } } }"}' \
          > ./data/transcripts.json

      - name: Commit and push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add ./data/transcripts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update transcripts" && git push)

